{% extends "base.html" %}

{% block title %}Оформление | GLOW VPN{% endblock %}

{% block content %}
<div class="page">
    <a href="/cart" class="back-link">← Назад в корзину</a>
    <h1 class="page-title fade-up">Оформление <em>заказа</em></h1>

    <div class="steps-bar fade-up d1">
        <span class="done"><b>✓</b>Тариф</span>
        <span class="done"><b>✓</b>Корзина</span>
        <span class="current"><b>3</b>Оплата</span>
    </div>

    <div class="checkout">
        <form id="order-form" class="panel form fade-up d2">
            <!-- имена полей name / phone / address совпадают с бэкендом (/api/orders) -->
            <label class="field">
                <span>Как к тебе обращаться</span>
                <input class="input" type="text" name="name" placeholder="Иван" autocomplete="name" required>
            </label>
            <label class="field">
                <span>Email — сюда придёт ключ VPN</span>
                <input class="input" type="email" name="address" placeholder="you@mail.ru" autocomplete="email" inputmode="email" required>
                <small>Проверь адрес внимательно: на него мы отправим ключ и инструкцию.</small>
            </label>
            <label class="field">
                <span>Телефон для связи</span>
                <input class="input" type="tel" name="phone" placeholder="+7 900 000-00-00"
                       autocomplete="tel" inputmode="tel" required pattern="[+]?[0-9\s()\-]{10,18}">
            </label>

            <button class="btn btn-primary" type="submit" id="payBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                Оплатить картой
            </button>
            <p id="status" class="form-status" role="status"></p>
            <div class="secure-note">🔐 Тебя перенаправит на защищённую страницу оплаты</div>
        </form>

        <aside class="panel summary fade-up d3" id="summary">
            <h2>Твой заказ</h2>
            <div id="orderItems"><div class="skeleton" style="min-height:60px"></div></div>
            <div class="summary-row total"><span>К оплате</span><span id="sumTotal">—</span></div>
        </aside>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
    const {escapeHtml, formatPrice, ensureCart} = window.Glow;
    const form = document.getElementById('order-form');
    const statusEl = document.getElementById('status');
    const payBtn = document.getElementById('payBtn');
    const itemsEl = document.getElementById('orderItems');

    const setStatus = (text, kind = '') => {
        statusEl.textContent = text;
        statusEl.className = `form-status ${kind}`;
    };

    /* сводка заказа */
    let hasItems = false;
    ensureCart()
        .then(() => fetch('/api/cart', {credentials: 'include'}))
        .then(r => r.json())
        .then(items => {
            if (!Array.isArray(items) || items.length === 0) {
                itemsEl.innerHTML = '<p style="color:var(--muted);line-height:1.6">Корзина пуста. <a href="/products#pricing" style="color:var(--lilac)">Выбери тариф</a></p>';
                document.getElementById('sumTotal').textContent = '0 ₽';
                return;
            }
            hasItems = true;
            let total = 0;
            itemsEl.innerHTML = items.map(item => {
                const sum = (Number(item.price) || 0) * (Number(item.quantity) || 1);
                total += sum;
                return `<div class="summary-row"><span>${escapeHtml(item.name || 'Тариф')}</span><span>${formatPrice(sum)} ₽</span></div>`;
            }).join('');
            document.getElementById('sumTotal').textContent = `${formatPrice(total)} ₽`;
        })
        .catch(() => { itemsEl.innerHTML = ''; });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!hasItems) {
            setStatus('Корзина пуста — сначала выбери тариф', 'error');
            return;
        }

        const original = payBtn.innerHTML;
        payBtn.disabled = true;
        payBtn.innerHTML = '<span class="spinner"></span>Создаём платёж…';
        setStatus('Создаём платёж, секунду…');

        try {
            const r = await fetch('/api/orders', {
                method: 'POST',
                credentials: 'include',
                body: new FormData(form),
            });
            const response = await r.json();
            if (response.payment_url) {
                setStatus('Переходим к оплате…', 'ok');
                window.location.href = response.payment_url;
                return;
            }
            setStatus('Не удалось создать платёж. Попробуй ещё раз или напиши в поддержку.', 'error');
        } catch {
            setStatus('Не удалось создать платёж. Попробуй ещё раз или напиши в поддержку.', 'error');
        }
        payBtn.disabled = false;
        payBtn.innerHTML = original;
    });
})();
</script>
{% endblock %}
