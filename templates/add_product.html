{% extends "base.html" %}

{% block title %}Добавить тариф | GLOW VPN{% endblock %}

{% block content %}
<div class="page" style="max-width:720px">
    <a href="/products#pricing" class="back-link">← К тарифам</a>
    <h1 class="page-title fade-up">Новый <em>тариф</em></h1>
    <p class="fade-up d1" style="color:var(--muted);margin:16px 0 30px;line-height:1.7">
        Тариф сразу появится на главной в блоке «Тарифы».
    </p>

    <form id="add-product-form" class="panel form fade-up d2">
        <label class="field">
            <span>Название тарифа</span>
            <input class="input" type="text" name="name" placeholder="Например: Сияние — 3 месяца" required>
        </label>
        <label class="field">
            <span>Цена, ₽</span>
            <input class="input" type="number" name="price" min="0" step="1" placeholder="357" required>
        </label>
        <label class="field">
            <span>Описание</span>
            <textarea class="input" name="description" rows="4" placeholder="Что входит в тариф" required></textarea>
        </label>
        <label class="field">
            <span>Картинка тарифа</span>
            <input class="input" type="file" name="photo" accept="image/*" required>
        </label>

        <button class="btn btn-primary" type="submit" id="submitBtn">Добавить тариф</button>
        <p id="status" class="form-status" role="status"></p>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
    const form = document.getElementById('add-product-form');
    const btn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        btn.disabled = true;
        statusEl.className = 'form-status';
        statusEl.textContent = 'Сохраняем…';
        try {
            const r = await fetch('/api/products', {method: 'POST', body: new FormData(form)});
            if (r.status === 403) { window.location.href = '/admin'; return; }
            if (!r.ok) throw new Error();
            const product = await r.json();
            statusEl.className = 'form-status ok';
            statusEl.textContent = 'Тариф добавлен';
            setTimeout(() => { window.location.href = `/product/${product.id}`; }, 700);
        } catch {
            statusEl.className = 'form-status error';
            statusEl.textContent = 'Не удалось сохранить тариф. Проверь поля и попробуй ещё раз.';
            btn.disabled = false;
        }
    });
})();
</script>
{% endblock %}
