{% extends "base.html" %}

{% block title %}Тариф | GLOW VPN{% endblock %}

{% block content %}
<div class="page">
    <a href="/products#pricing" class="back-link">← Все тарифы</a>

    <div id="product-card" class="product-layout">
        <div class="skeleton" style="aspect-ratio:1/1;min-height:0"></div>
        <div>
            <div class="skeleton" style="min-height:60px;margin-bottom:18px"></div>
            <div class="skeleton" style="min-height:240px"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(() => {
    const {escapeHtml, normalizePhotoPath, formatPrice, buy} = window.Glow;
    const productId = window.location.pathname.split('/').filter(Boolean).pop();
    const card = document.getElementById('product-card');

    const renderError = () => {
        card.className = '';
        card.innerHTML = `
            <div class="empty-state">
                <strong>Тариф не найден</strong>
                Возможно, он больше не продаётся. Посмотри актуальные тарифы.
                <br><a class="btn btn-primary" href="/products#pricing">К тарифам</a>
            </div>`;
    };

    fetch(`/api/products/${encodeURIComponent(productId)}`)
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(p => {
            const name = escapeHtml(p.name || 'Тариф');
            const desc = escapeHtml(p.description || '');
            const photo = normalizePhotoPath(p.photo);
            document.title = `${p.name || 'Тариф'} | GLOW VPN`;

            card.innerHTML = `
                <div class="product-media${photo ? '' : ' empty'}">
                    <img src="${photo ? escapeHtml(photo) : '/static/ava.webp'}" alt="${name}">
                </div>

                <div class="product-info fade-up">
                    <div class="eyebrow">Тариф GLOW VPN</div>
                    <h1>${name}</h1>
                    <div class="product-price"><strong>${formatPrice(p.price)}</strong><span>₽</span></div>
                    ${desc ? `<p class="product-desc">${desc}</p>` : ''}

                    <ul class="check-list">
                        <li>Безлимитный трафик и высокая скорость</li>
                        <li>Все локации и современные протоколы</li>
                        <li>iOS, Android, Windows, macOS, Smart TV</li>
                        <li>Покупка без Telegram — оплата картой на сайте</li>
                    </ul>

                    <div class="product-actions">
                        <button class="btn btn-primary" id="buyBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8Z"/></svg>
                            Купить за ${formatPrice(p.price)} ₽
                        </button>
                        <a class="btn btn-ghost" href="/products#pricing">Другие тарифы</a>
                    </div>

                    <div class="trust-row">
                        <span>💳 Visa / MasterCard / МИР</span>
                        <span>🔐 Защищённый платёж</span>
                        <span>🔒 No-logs</span>
                    </div>
                </div>`;

            const img = card.querySelector('.product-media img');
            img.addEventListener('error', () => {
                img.parentElement.classList.add('empty');
                img.src = '/static/ava.webp';
            }, {once: true});

            document.getElementById('buyBtn').addEventListener('click', (e) => buy(p.id, e.currentTarget));
        })
        .catch(renderError);
})();
</script>
{% endblock %}
