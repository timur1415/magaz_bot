<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карточка товара</title>
    <style>
      :root {
        --swamp-950: #0f1408;
        --swamp-900: #171f0d;
        --swamp-800: #243111;
        --swamp-700: #34501a;
        --acid: #c9ff31;
        --acid-soft: #8bcf22;
        --purple: #8d3dff;
        --purple-soft: #bf8dff;
        --mist: #eef8d8;
        --text: #f7ffe8;
        --muted: #cad7ae;
        --panel: rgba(22, 34, 10, 0.78);
        --line: rgba(210, 255, 92, 0.18);
        --glow: 0 24px 60px rgba(80, 10, 150, 0.28);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Trebuchet MS", sans-serif;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(141, 61, 255, 0.3),
            transparent 24%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(201, 255, 49, 0.18),
            transparent 20%
          ),
          radial-gradient(
            circle at 50% 100%,
            rgba(95, 145, 22, 0.24),
            transparent 28%
          ),
          linear-gradient(
            135deg,
            var(--swamp-950) 0%,
            var(--swamp-900) 36%,
            #1f250e 62%,
            #13180b 100%
          );
        padding: 28px 20px 64px;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(201, 255, 49, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(141, 61, 255, 0.05) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.42),
          transparent 90%
        );
      }

      .page {
        max-width: 1180px;
        margin: 0 auto;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text);
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid rgba(191, 141, 255, 0.24);
        background: rgba(141, 61, 255, 0.12);
        box-shadow: 0 0 0 1px rgba(201, 255, 49, 0.08) inset;
        margin-bottom: 24px;
        transition: 0.25s ease;
      }

      .back:hover {
        transform: translateY(-2px);
        border-color: rgba(201, 255, 49, 0.42);
        background: rgba(141, 61, 255, 0.18);
      }

      .state,
      .layout {
        border-radius: 34px;
        border: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(21, 30, 11, 0.94),
          rgba(15, 21, 8, 0.92)
        );
        box-shadow: var(--glow);
        overflow: hidden;
      }

      .state {
        min-height: 68vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 40px;
      }

      .state-inner {
        max-width: 560px;
      }

      .state-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 82px;
        height: 82px;
        border-radius: 50%;
        margin-bottom: 18px;
        background: radial-gradient(
          circle,
          rgba(201, 255, 49, 0.22),
          rgba(141, 61, 255, 0.18)
        );
        border: 1px solid rgba(201, 255, 49, 0.24);
        color: var(--acid);
        font-size: 2rem;
        box-shadow: 0 0 40px rgba(141, 61, 255, 0.25);
      }

      .state h1 {
        font-size: clamp(2.4rem, 4vw, 3.6rem);
        line-height: 0.95;
        margin-bottom: 12px;
      }

      .state p {
        color: var(--muted);
        line-height: 1.7;
        font-size: 1.05rem;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(320px, 1.05fr) minmax(320px, 0.95fr);
      }

      .media {
        position: relative;
        min-height: 720px;
        background:
          linear-gradient(180deg, rgba(201, 255, 49, 0.14), transparent 25%),
          linear-gradient(220deg, rgba(141, 61, 255, 0.24), transparent 46%),
          linear-gradient(135deg, #253910, #17210b 54%, #120f1f);
      }

      .media img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        mix-blend-mode: screen;
      }

      .media-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 40px;
        text-align: center;
        color: var(--mist);
        background:
          radial-gradient(
            circle at center,
            rgba(201, 255, 49, 0.22),
            transparent 34%
          ),
          linear-gradient(
            135deg,
            rgba(141, 61, 255, 0.22),
            rgba(52, 80, 26, 0.42)
          );
      }

      .media-empty strong {
        display: block;
        font-size: 1.2rem;
        margin-bottom: 10px;
        color: var(--acid);
        text-transform: uppercase;
        letter-spacing: 0.18em;
      }

      .info {
        padding: 36px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 28px;
        background: linear-gradient(
          180deg,
          rgba(18, 26, 10, 0.92),
          rgba(17, 20, 14, 0.95)
        );
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--acid);
        text-transform: uppercase;
        letter-spacing: 0.22em;
        font-size: 0.76rem;
      }

      .eyebrow::before {
        content: "";
        width: 38px;
        height: 1px;
        background: linear-gradient(90deg, var(--acid), var(--purple-soft));
      }

      h1 {
        font-size: clamp(2.8rem, 5vw, 4.5rem);
        line-height: 0.92;
        margin: 16px 0 18px;
        text-shadow: 0 0 24px rgba(141, 61, 255, 0.22);
      }

      .price {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 22px;
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(201, 255, 49, 0.09);
        border: 1px solid rgba(201, 255, 49, 0.2);
        color: var(--mist);
        font-size: 1.7rem;
        font-weight: 700;
        box-shadow: 0 0 28px rgba(201, 255, 49, 0.08) inset;
      }

      .price small {
        color: var(--purple-soft);
        font-size: 0.78rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .description {
        color: var(--muted);
        line-height: 1.85;
        font-size: 1.02rem;
      }

      .meta-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .meta-card {
        padding: 16px 18px;
        border-radius: 22px;
        border: 1px solid rgba(191, 141, 255, 0.18);
        background: linear-gradient(
          180deg,
          rgba(141, 61, 255, 0.08),
          rgba(39, 55, 16, 0.48)
        );
      }

      .meta-card span {
        display: block;
        color: var(--purple-soft);
        font-size: 0.74rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        margin-bottom: 10px;
      }

      .meta-card strong {
        display: block;
        color: var(--text);
        line-height: 1.4;
        word-break: break-word;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .actions a {
        text-decoration: none;
        padding: 14px 20px;
        border-radius: 999px;
        transition: 0.25s ease;
      }

      .actions .primary {
        background: linear-gradient(135deg, var(--acid), #9bd112);
        color: #142008;
        font-weight: 700;
      }

      .actions .secondary {
        color: var(--text);
        border: 1px solid rgba(191, 141, 255, 0.22);
        background: rgba(141, 61, 255, 0.14);
      }

      .actions a:hover {
        transform: translateY(-2px);
      }

      @media (max-width: 940px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .media {
          min-height: 460px;
        }
      }

      @media (max-width: 640px) {
        body {
          padding: 18px 14px 40px;
        }

        .info,
        .state {
          padding: 24px;
        }

        .meta-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <a href="/products" class="back">← Назад в каталог</a>
      <div id="product-card" class="state">
        <div class="state-inner">
          <div class="state-mark">+</div>
          <h1>Подгружаю товар из базы</h1>
          <p>
            Страница соберет карточку из данных товара: название, цену, описание
            и фото.
          </p>
        </div>
      </div>
    </div>
    <script>
      const productId = window.location.pathname.split("/").pop();
      const productCard = document.getElementById("product-card");

      const escapeHtml = (value) =>
        String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#39;");

      const normalizePhotoPath = (photo) => {
        if (!photo) {
          return "";
        }
        const normalizedPhoto = String(photo).trim();
        if (
          /^https?:\/\//i.test(normalizedPhoto) ||
          normalizedPhoto.startsWith("/")
        ) {
          return normalizedPhoto;
        }
        if (normalizedPhoto.startsWith("static/")) {
          return `/${normalizedPhoto}`;
        }
        if (normalizedPhoto.startsWith("uploads/")) {
          return `/static/${normalizedPhoto}`;
        }
        if (!normalizedPhoto.includes("/")) {
          return `/static/uploads/${normalizedPhoto}`;
        }
        return `/${normalizedPhoto}`;
      };

      const formatPrice = (value) => {
        const numericPrice = Number(value);
        if (!Number.isFinite(numericPrice)) {
          return "Цена не указана";
        }
        return `${new Intl.NumberFormat("ru-RU").format(numericPrice)} ₽`;
      };

      const renderErrorState = () => {
        productCard.className = "state";
        productCard.innerHTML = `
                <div class="state-inner">
                    <div class="state-mark">!</div>
                    <h1>Товар не загрузился</h1>
                    <p>Не удалось получить данные из базы. Вернись в каталог и попробуй открыть карточку снова.</p>
                </div>
            `;
      };

      const buildMissingPhotoMarkup = () => `
            <div class="media-empty">
                <div>
                    <strong>Фото отсутствует</strong>
                    Для этого товара в базе пока нет изображения.
                </div>
            </div>
        `;

      async function fetchProduct(id) {
        try {
          const response = await fetch(`/api/products/${id}`);
          if (!response.ok) {
            throw new Error("Product request failed");
          }

          const product = await response.json();
          const title = escapeHtml(product.name || "Без названия");
          const description = escapeHtml(
            product.description || "Описание пока не добавлено.",
          );
          const photo = normalizePhotoPath(product.photo);
          const price = formatPrice(product.price);
          const productNumber = escapeHtml(product.id || "—");
          const photoState = photo ? "есть в базе" : "не загружено";
          const descriptionSize = `${description.replaceAll(/&[^;]+;/g, " ").trim().length} символов`;

          document.title = `${title} | Карточка товара`;
          productCard.className = "layout";
          productCard.innerHTML = `
                    <section class="media">
                        ${photo ? `<img src="${escapeHtml(photo)}" alt="${title}">` : buildMissingPhotoMarkup()}
                    </section>

                    <section class="info">
                        <div>
                            <div class="eyebrow">db powered product view</div>
                            <h1>${title}</h1>
                            <div class="price">
                                <small>price</small>
                                ${price}
                            </div>
                            <p class="description">${description}</p>
                        </div>

                        <div class="meta-grid">
                            <article class="meta-card">
                                <span>ID товара</span>
                                <strong>#${productNumber}</strong>
                            </article>
                            <article class="meta-card">
                                <span>Фото</span>
                                <strong>${photoState}</strong>
                            </article>
                            <article class="meta-card">
                                <span>Описание</span>
                                <strong>${descriptionSize}</strong>
                            </article>
                            <article class="meta-card">
                                <span>Источник</span>
                                <strong>База данных через /api/products/${productNumber}</strong>
                            </article>
                        </div>
                        <div class="cart">
                            <button class="add-to-cart" data-product-id="${productNumber}">Добавить в корзину</button>
                        </div>
                        <div class="actions">                            
                            <a href="/products" class="primary">Вернуться в каталог</a>
                            <a href="/add_product" class="secondary">Добавить еще товар</a>
                        </div>
                    </section>
                `;

          const image = productCard.querySelector(".media img");
          if (image) {
            image.addEventListener(
              "error",
              () => {
                image.insertAdjacentHTML("afterend", buildMissingPhotoMarkup());
                image.remove();
              },
              { once: true },
            );
          }
        } catch (error) {
          renderErrorState();
        }
        document
          .querySelector(".add-to-cart")
          .addEventListener("click", async (event) => {
            const productId = event.target.dataset.productId;
            console.log(`Добавлен в корзину товар с ID: ${productId}`);
            const response = await fetch(`/api/carts/add/${productId}`, {
              method: "POST",
              credentials: "include"
            });
            const result = await response.json();
            if (result.status === 'success') {
              document.querySelector(".cart").insertAdjacentHTML("beforeend", `<p>Товар с ID: ${productId} успешно добавлен в корзину</p>`);
              window.location = '/cart'
            } else {
              console.error(`Ошибка при добавлении товара с ID: ${productId} в корзину`);
            }
          });
      }



      fetchProduct(productId);
    </script>

  </body>
</html>
